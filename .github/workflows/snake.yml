name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *"   # runs every 6 hours
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake game from GitHub contribution grid
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: spatelpatidar
          outputs: |
            dist/github-snake-dark.svg?color_snake=%2338bdf8&color_dots=%230d1117,%230e75b6,%232563eb,%230ea5e9,%2338bdf8
            dist/github-snake-light.svg?color_snake=%230e75b6&color_dots=%23eeeeee,%23a5d8ff,%2374c0fc,%234dabf7,%230e75b6&color_snake=%230e75b6

      - name: Push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
