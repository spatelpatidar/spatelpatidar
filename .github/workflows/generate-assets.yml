name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"        # once a day (the fork build makes runs longer)
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  generate-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- 3D contribution graph ----------
      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: spatelpatidar

      # ---------- Snake ----------
      - name: Generate snake game
        uses: Platane/snk@v3
        with:
          github_user_name: spatelpatidar
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake-light.svg?palette=github-light

      # ---------- Metrics (rendered to disk, NOT committed) ----------
      - name: Metrics - GitHub stats
        uses: lowlighter/metrics@latest
        continue-on-error: true
        timeout-minutes: 8
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: spatelpatidar
          template: classic
          filename: github-metrics.svg
          output_action: none
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata

      - name: Metrics - Languages
        uses: lowlighter/metrics@latest
        continue-on-error: true
        timeout-minutes: 8
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: spatelpatidar
          template: classic
          filename: metrics.plugin.languages.svg
          output_action: none
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 10
          plugin_languages_colors: github

      - name: Metrics - Commit calendar
        uses: lowlighter/metrics@latest
        continue-on-error: true
        timeout-minutes: 8
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: spatelpatidar
          template: classic
          filename: metrics.plugin.isocalendar.fullyear.svg
          output_action: none
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Metrics - Lines of code
        uses: lowlighter/metrics@latest
        continue-on-error: true
        timeout-minutes: 8
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: spatelpatidar
          template: classic
          filename: metrics.plugin.lines.svg
          output_action: none
          base: ""
          plugin_lines: yes

      - name: Metrics - Topics
        uses: lowlighter/metrics@latest
        continue-on-error: true
        timeout-minutes: 8
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: spatelpatidar
          template: classic
          filename: metrics.plugin.topics.svg
          output_action: none
          base: ""
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_sort: stars
          plugin_topics_limit: 15

      - name: Metrics - Starred repositories
        uses: lowlighter/metrics@latest
        continue-on-error: true
        timeout-minutes: 8
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: spatelpatidar
          template: classic
          filename: metrics.plugin.stars.svg
          output_action: none
          base: ""
          plugin_stars: yes
          plugin_stars_limit: 4

      - name: Metrics - Notable contributions
        uses: lowlighter/metrics@latest
        continue-on-error: true
        timeout-minutes: 8
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: spatelpatidar
          template: classic
          filename: metrics.plugin.notable.svg
          output_action: none
          base: ""
          plugin_notable: yes

      - name: Metrics - People
        uses: lowlighter/metrics@latest
        continue-on-error: true
        timeout-minutes: 8
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: spatelpatidar
          template: classic
          filename: metrics.plugin.people.svg
          output_action: none
          base: ""
          plugin_people: yes
          plugin_people_types: followers, following

      - name: Metrics - Pinned repositories
        uses: lowlighter/metrics@latest
        continue-on-error: true
        timeout-minutes: 8
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: spatelpatidar
          template: classic
          filename: metrics.plugin.pinned.svg
          output_action: none
          base: ""
          plugin_repositories: yes
          plugin_repositories_pinned: 6

      - name: Build patched metrics image (no full build)
        run: |
          set -e
          docker pull ghcr.io/lowlighter/metrics:v3.34
          docker run --name metrics-patch --entrypoint /bin/sh ghcr.io/lowlighter/metrics:v3.34 -c '
            cd /metrics/source/plugins
            sed -i "s/\bprojects\b/projectsV2/g" achievements/queries/achievements.graphql achievements/list/users.mjs
            sed -i "s/payload\.commits)/payload.commits ?? [])/" habits/index.mjs
            echo "--- achievements patch ---"
            grep -n "projectsV2" achievements/queries/achievements.graphql achievements/list/users.mjs
            echo "--- habits patch ---"
            grep -n "payload.commits" habits/index.mjs
            grep -q "projectsV2" achievements/list/users.mjs
            grep -q "payload.commits ?? \[\]" habits/index.mjs
          '
          docker commit metrics-patch metrics:3.34.0

      # ================= PATCHED FORK (achievements + habits) =================
      # First step builds the Docker image (several minutes), second reuses it.
      - name: Metrics - Achievements (patched)
        uses: lowlighter/metrics@latest
        continue-on-error: true
        timeout-minutes: 10
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: spatelpatidar
          template: classic
          filename: metrics.plugin.achievements.svg
          output_action: none
          base: ""
          use_prebuilt_image: no
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 0
          plugins_errors_fatal: yes

      - name: Metrics - Coding habits (patched)
        uses: lowlighter/metrics@latest
        continue-on-error: true
        timeout-minutes: 10
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: spatelpatidar
          template: classic
          filename: metrics.plugin.habits.charts.svg
          output_action: none
          base: ""
          use_prebuilt_image: no
          plugin_habits: yes
          plugin_habits_from: 100
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: no
          plugins_errors_fatal: yes

      # ---------- Collect everything ----------
      - name: Consolidate build assets
        run: |
          mkdir -p output_assets/metrics
          # Move snake assets
          cp -r dist/* output_assets/
          # Move 3D contribution assets
          cp -r profile-3d-contrib output_assets/
          # Metrics assets (rendered by lowlighter/metrics)
          cp /metrics_renders/*.svg output_assets/metrics/
          ls -R output_assets

      # ---------- Preview page (NEW) ----------
      - name: Build preview page
        run: |
          cd output_assets
          BASE="https://raw.githubusercontent.com/${{ github.repository }}/output"
          {
            echo "# Metrics preview"
            echo
            for f in $(ls metrics/*.svg | sort); do
              echo "### \`$f\`"
              echo "![${f}](${BASE}/${f})"
              echo
            done
          } > preview.md

      - name: Deploy all assets to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: output_assets
          keep_files: false

