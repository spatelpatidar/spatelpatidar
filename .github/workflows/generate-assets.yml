name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"        # once a day (the fork build makes runs longer)
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  generate-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- 3D contribution graph ----------
      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: spatelpatidar

      # ---------- Snake ----------
      - name: Generate snake game
        uses: Platane/snk@v3
        with:
          github_user_name: spatelpatidar
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake-light.svg?palette=github-light

      # ---------- Metrics (lowlighter prebuilt image) ----------
      - name: Metrics - GitHub stats
        uses: lowlighter/metrics@latest
        continue-on-error: true
        timeout-minutes: 8
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: spatelpatidar
          template: classic
          filename: github-metrics.svg
          output_action: none
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata

      - name: Metrics - Languages
        uses: lowlighter/metrics@latest
        continue-on-error: true
        timeout-minutes: 8
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: spatelpatidar
          template: classic
          filename: metrics.plugin.languages.svg
          output_action: none
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 10
          plugin_languages_colors: github

      - name: Metrics - Commit calendar
        uses: lowlighter/metrics@latest
        continue-on-error: true
        timeout-minutes: 8
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: spatelpatidar
          template: classic
          filename: metrics.plugin.isocalendar.fullyear.svg
          output_action: none
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Metrics - Lines of code
        uses: lowlighter/metrics@latest
        continue-on-error: true
        timeout-minutes: 10
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: spatelpatidar
          template: classic
          filename: metrics.plugin.lines.svg
          output_action: none          # <-- was commit
          base: header
          plugin_lines: yes
          plugin_lines_sections: base, repositories
          plugin_lines_history_limit: 5
          plugin_lines_delay: 30
          plugin_lines_repositories_limit: 10
          plugin_lines_skipped: spatelpatidar/securevault, spatelpatidar/jwt_authentication, spatelpatidar/render_ping, spatelpatidar/securevault-original-code, spatelpatidar/interview_prep, spatelpatidar/mygit-ruby, spatelpatidar/billing_system, spatelpatidar/render-cron-job
          # plugin_lines_skipped: mygit-ruby, securevault-original-code
          commits_authoring: spatelpatidar

      - name: Metrics - Starred repositories
        uses: lowlighter/metrics@latest
        continue-on-error: true
        timeout-minutes: 8
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: spatelpatidar
          template: classic
          filename: metrics.plugin.stars.svg
          output_action: none
          base: ""
          plugin_stars: yes
          plugin_stars_limit: 4

      - name: Metrics - People
        uses: lowlighter/metrics@latest
        continue-on-error: true
        timeout-minutes: 8
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: spatelpatidar
          template: classic
          filename: metrics.plugin.people.svg
          output_action: none
          base: ""
          plugin_people: yes
          plugin_people_types: followers, following

      - name: Metrics - Pinned repositories
        uses: lowlighter/metrics@latest
        continue-on-error: true
        timeout-minutes: 8
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: spatelpatidar
          template: classic
          filename: metrics.plugin.pinned.svg
          output_action: none
          base: ""
          plugin_repositories: yes
          plugin_repositories_pinned: 6

      - name: Metrics - Repositories traffic
        uses: lowlighter/metrics@latest
        continue-on-error: true
        timeout-minutes: 10
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: spatelpatidar
          template: classic
          filename: metrics.plugin.traffic.svg
          output_action: none
          base: repositories
          plugin_traffic: yes
          plugin_traffic_skipped: spatelpatidar/securevault, spatelpatidar/jwt_authentication, spatelpatidar/render_ping, spatelpatidar/securevault-original-code, spatelpatidar/interview_prep, spatelpatidar/mygit-ruby, spatelpatidar/billing_system, spatelpatidar/render-cron-job
          plugins_errors_fatal: yes

      - name: Metrics - Repository template (spatelpatidar)
        uses: lowlighter/metrics@latest
        continue-on-error: true
        timeout-minutes: 10
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: spatelpatidar
          repo: spatelpatidar
          template: repository
          filename: metrics.template.repository.spatelpatidar.svg
          output_action: none

      - name: Metrics - Repository template (respondo)
        uses: lowlighter/metrics@latest
        continue-on-error: true
        timeout-minutes: 10
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: spatelpatidar
          repo: respondo
          template: repository
          filename: metrics.template.repository.respondo.svg
          output_action: none

      - name: Metrics - Repository template (respondo-graphql)
        uses: lowlighter/metrics@latest
        continue-on-error: true
        timeout-minutes: 10
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: spatelpatidar
          repo: respondo-graphql
          template: repository
          filename: metrics.template.repository.respondo-graphql.svg
          output_action: none

      - name: Metrics - Repository template (respondo-grpc)
        uses: lowlighter/metrics@latest
        continue-on-error: true
        timeout-minutes: 10
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: spatelpatidar
          repo: respondo-grpc
          template: repository
          filename: metrics.template.repository.respondo-grpc.svg
          output_action: none

      # ================= PATCHED FORK (prebuilt image) =================
      # Download the image built by the fork's "Build metrics image" workflow
      # and give it the name the action looks for, so no build happens here.
      - name: Pull prebuilt fork image
        id: forkimage
        continue-on-error: true
        run: |
          docker pull ghcr.io/skshailendrakumar/metrics-fork:latest
          docker tag ghcr.io/skshailendrakumar/metrics-fork:latest metrics:forked-3.35.0-beta

      - name: Metrics - Achievements (fork)
        if: steps.forkimage.outcome == 'success'
        uses: skshailendrakumar/metrics@master
        continue-on-error: true
        timeout-minutes: 10
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: spatelpatidar
          template: classic
          filename: metrics.plugin.achievements.svg
          output_action: none
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 0
          plugins_errors_fatal: yes

      - name: Metrics - Achievements detailed (fork)
        if: steps.forkimage.outcome == 'success'
        uses: skshailendrakumar/metrics@master
        continue-on-error: true
        timeout-minutes: 10
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: spatelpatidar
          template: classic
          filename: metrics.plugin.achievements.detailed.svg
          output_action: none
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed
          plugin_achievements_limit: 0
          plugins_errors_fatal: yes

      - name: Metrics - Recent activity (fork)
        if: steps.forkimage.outcome == 'success'
        uses: skshailendrakumar/metrics@master
        continue-on-error: true
        timeout-minutes: 10
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: spatelpatidar
          template: classic
          filename: metrics.plugin.activity.svg
          output_action: none
          base: ""
          plugin_activity: yes
          plugin_activity_limit: 8
          plugin_activity_days: 14
          plugin_activity_load: 300
          plugin_activity_visibility: public
          plugin_activity_timestamps: yes
          plugin_activity_filter: all
          plugins_errors_fatal: yes

      # ---------- Collect everything ----------
      - name: Consolidate build assets
        run: |
          mkdir -p output_assets/metrics
          # Move snake assets
          cp -r dist/* output_assets/
          # Move 3D contribution assets
          cp -r profile-3d-contrib output_assets/
          # Metrics assets (rendered by lowlighter/metrics)
          cp /metrics_renders/*.svg output_assets/metrics/
          ls -R output_assets

      # ---------- Preview page (NEW) ----------
      - name: Build preview page
        run: |
          cd output_assets
          BASE="https://raw.githubusercontent.com/${{ github.repository }}/output"
          {
            echo "# Metrics preview"
            echo
            for f in $(ls metrics/*.svg | sort); do
              echo "### \`$f\`"
              echo "![${f}](${BASE}/${f})"
              echo
            done
          } > preview.md

      - name: Deploy all assets to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: output_assets
          keep_files: false

  deploy-pages:
    needs: generate-assets
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare site folder (only index.html is published)
        run: |
          mkdir -p site
          cp index.html site/index.html
          cp favicon.svg site/favicon.svg
          touch site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

